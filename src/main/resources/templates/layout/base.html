<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Dề Dê Tickets">Dề Dê Tickets</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: DM Sans + DM Serif Display -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <!-- CSS toàn cục -->
    <link th:href="@{/css/main.css}" rel="stylesheet">

    <!-- CSS riêng từng trang (nếu có) -->
    <th:block layout:fragment="page-css"></th:block>
</head>
<body>

    <!-- Navbar (ẩn trên trang login/register) -->
    <nav th:if="${showNavbar != false}" class="navbar navbar-expand-lg dd-navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-ticket-perforated-fill me-2"></i>Dề Dê Tickets
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/su-kien}">
                            <i class="bi bi-calendar-event me-1"></i>Sự kiện
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <!-- Chưa đăng nhập -->
                    <li class="nav-item" th:if="${session.nguoiDung == null}">
                        <a class="btn btn-outline-light btn-sm" th:href="@{/dang-nhap}">Đăng nhập</a>
                    </li>
                    <!-- Đã đăng nhập -->
                    <li class="nav-item dropdown" th:if="${session.nguoiDung != null}">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" data-bs-toggle="dropdown">
                            <div class="dd-avatar">
                                <span th:text="${#strings.substring(session.nguoiDung.tenTaiKhoan, 0, 1).toUpperCase()}">U</span>
                            </div>
                            <span th:text="${session.nguoiDung.tenTaiKhoan}">Người dùng</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/ve-cua-toi}"><i class="bi bi-ticket me-2"></i>Vé của tôi</a></li>
                            <li><a class="dropdown-item" th:href="@{/tai-khoan}"><i class="bi bi-person me-2"></i>Tài khoản</a></li>
                            <li th:if="${session.nguoiDung.isAdmin}">
                                <hr class="dropdown-divider">
                                <a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-gear me-2"></i>Quản trị</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/dang-xuat}" method="post">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Nội dung từng trang inject vào đây -->
    <main layout:fragment="content"></main>

    <!-- Footer -->
    <footer th:if="${showFooter != false}" class="dd-footer mt-auto">
        <div class="container py-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <span class="fw-semibold"><i class="bi bi-ticket-perforated-fill me-1"></i>Dề Dê Tickets</span>
                    <span class="text-muted ms-2" style="font-size: 13px;">© 2025 ITPJ2602 – Nhóm SPRING</span>
                </div>
                <div class="col-md-6 text-md-end mt-2 mt-md-0">
                    <span class="text-muted" style="font-size: 13px;">Hệ thống Quản lý Sự kiện &amp; Bán vé trực tuyến</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS riêng từng trang -->
    <th:block layout:fragment="page-js"></th:block>
</body>
</html>
